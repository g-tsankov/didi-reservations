<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <!-- Applies a stored light theme before any CSS loads, so it does not flash dark first (see src/js/useTheme.ts). -->
  <script>try { if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}</script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin</title>
</head>
<body>

  <!-- The admin page is a Vue app: src/vue/admin/AdminApp.vue -->
  <div id="app"></div>

  <script type="module" src="/js/entry-admin.ts"></script>
</body>
</html>
