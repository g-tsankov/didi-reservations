<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="navbar topbar">
    <div class="container gap-2">
      <span class="navbar-brand text-white mb-0 h1 fs-5">
        <span class="business-name"></span> · <span data-i18n="admin.title"></span>
      </span>
      <div class="d-flex align-items-center gap-2">
        <a href="/" class="btn btn-sm btn-outline-light" target="_blank" rel="noopener">
          <i class="bi bi-box-arrow-up-right" aria-hidden="true"></i>
          <span class="d-none d-sm-inline" data-i18n="admin.viewSite"></span>
        </a>
        <div class="btn-group btn-group-sm lang-switch" role="group" aria-label="Language">
          <button type="button" class="btn btn-outline-light" data-lang="bg">BG</button>
          <button type="button" class="btn btn-outline-light" data-lang="en">EN</button>
        </div>
        <button type="button" class="btn btn-sm btn-light d-none" id="logout">
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
          <span class="d-none d-sm-inline" data-i18n="admin.logout"></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- Login -->
  <section id="login-view" class="container d-none">
    <div class="card admin-login shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-3" data-i18n="admin.loginTitle"></h1>
        <form id="login-form">
          <div class="mb-3">
            <label for="password" class="form-label" data-i18n="admin.password"></label>
            <input type="password" class="form-control" id="password" autocomplete="current-password" required>
          </div>
          <div class="alert alert-danger d-none" id="login-error" role="alert"></div>
          <button type="submit" class="btn btn-primary w-100" id="login-submit" data-i18n="admin.login"></button>
        </form>
      </div>
    </div>
  </section>

  <!-- Event list -->
  <main id="app-view" class="container py-4 d-none">
    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
      <h1 class="h3 mb-0" data-i18n="admin.classes"></h1>
      <div class="d-flex flex-wrap gap-2">
        <div class="btn-group btn-group-sm" role="group" id="filter">
          <button type="button" class="btn btn-outline-secondary active" data-filter="all" data-i18n="admin.filterAll"></button>
          <button type="button" class="btn btn-outline-secondary" data-filter="upcoming" data-i18n="admin.filterUpcoming"></button>
          <button type="button" class="btn btn-outline-secondary" data-filter="past" data-i18n="admin.filterPast"></button>
        </div>
        <button type="button" class="btn btn-primary btn-sm" id="new-event">
          <i class="bi bi-plus-lg" aria-hidden="true"></i> <span data-i18n="admin.newClass"></span>
        </button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="table-responsive">
        <table class="table table-hover mb-0 events-table">
          <thead>
            <tr>
              <th data-i18n="admin.colName"></th>
              <th data-i18n="admin.colDate"></th>
              <th class="text-center" data-i18n="admin.colBooked"></th>
              <th data-i18n="admin.colStatus"></th>
            </tr>
          </thead>
          <tbody id="events-body"></tbody>
        </table>
      </div>
      <div id="events-empty" class="text-center text-body-secondary py-5 d-none" data-i18n="admin.noClasses"></div>
    </div>
  </main>

  <!-- Create / edit popup -->
  <div class="modal fade" id="eventModal" tabindex="-1" aria-labelledby="eventModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="eventModalLabel"></h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="event-form" novalidate>
            <div class="row g-3">
              <div class="col-12">
                <label for="e-name" class="form-label" data-i18n="admin.name"></label>
                <input type="text" class="form-control" id="e-name" maxlength="120" required>
                <div class="invalid-feedback" data-i18n="err.invalid_name"></div>
              </div>
              <div class="col-12">
                <label for="e-description" class="form-label" data-i18n="admin.description"></label>
                <textarea class="form-control" id="e-description" rows="3" maxlength="2000"></textarea>
              </div>
              <div class="col-6 col-md-3 d-flex flex-column">
                <label for="e-start-date" class="form-label flex-grow-1 d-flex align-items-end" data-i18n="admin.startDate"></label>
                <input type="date" class="form-control" id="e-start-date" required>
                <div class="invalid-feedback" data-i18n="err.invalid_start"></div>
              </div>
              <div class="col-6 col-md-3 d-flex flex-column">
                <label for="e-start-time" class="form-label flex-grow-1 d-flex align-items-end" data-i18n="admin.startTime"></label>
                <input type="time" class="form-control" id="e-start-time" required>
                <div class="invalid-feedback" data-i18n="err.invalid_start"></div>
              </div>
              <div class="col-6 col-md-3 d-flex flex-column">
                <label for="e-duration" class="form-label flex-grow-1 d-flex align-items-end" data-i18n="admin.duration"></label>
                <input type="number" class="form-control" id="e-duration" min="1" max="1440" step="1" required>
                <div class="invalid-feedback" data-i18n="err.invalid_duration"></div>
              </div>
              <div class="col-6 col-md-3 d-flex flex-column">
                <label for="e-capacity" class="form-label flex-grow-1 d-flex align-items-end" data-i18n="admin.capacity"></label>
                <input type="number" class="form-control" id="e-capacity" min="1" max="1000" step="1" required>
                <div class="invalid-feedback" data-i18n="err.invalid_capacity"></div>
              </div>
            </div>

            <div class="alert alert-danger mt-3 mb-0 d-none" id="event-error" role="alert"></div>
            <div class="alert alert-success mt-3 mb-0 d-none" id="event-saved" role="status" data-i18n="admin.saved"></div>

            <div class="d-flex justify-content-between gap-2 mt-3">
              <button type="button" class="btn btn-outline-danger" id="delete-event">
                <i class="bi bi-trash" aria-hidden="true"></i> <span data-i18n="admin.deleteClass"></span>
              </button>
              <button type="submit" class="btn btn-primary ms-auto" id="save-event">
                <i class="bi bi-check-lg" aria-hidden="true"></i> <span data-i18n="admin.save"></span>
              </button>
            </div>
          </form>

          <section id="signups" class="mt-4 pt-3 border-top">
            <h3 class="h6 mb-3" id="signups-title"></h3>
            <p class="text-body-secondary mb-0 d-none" id="signups-empty" data-i18n="admin.noSignups"></p>
            <div class="table-responsive">
              <table class="table table-sm align-middle mb-0" id="signups-table">
                <thead>
                  <tr>
                    <th data-i18n="yourName"></th>
                    <th data-i18n="email"></th>
                    <th data-i18n="phone"></th>
                    <th data-i18n="admin.bookedAt"></th>
                    <th></th>
                  </tr>
                </thead>
                <tbody id="signups-body"></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
